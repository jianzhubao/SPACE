[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "space-calibration"
version = "0.1.0"
description = "Data-free geometric calibration of supervised fine-tuned checkpoints"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["numpy>=1.24", "torch>=2.6", "safetensors>=0.4.3", "huggingface-hub>=0.25"]

[project.scripts]
space-calibrate = "space_calibration.cli:main"

[dependency-groups]
dev = ["build>=1.2", "twine>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/space_calibration"]

[tool.hatch.build.targets.sdist]
include = ["/src/space_calibration", "/examples", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml"]
